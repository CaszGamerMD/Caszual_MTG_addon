plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
base { archivesName = 'caszual-mtg' }

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    implementation "curse.maven:mtgcard-1459416:8893701"
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.register('verifyDeckLists', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.casz.caszualmtg.DeckListCheck'
}
tasks.named('check') { dependsOn verifyDeckLists }

// Parser checks use an explicit Java harness rather than JUnit.
tasks.named("test") { enabled = false }
tasks.register('verifyCatalogue', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.casz.caszualmtg.CatalogueCheck'
}
tasks.named('check') { dependsOn verifyCatalogue }
tasks.register('verifyArchidekt', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.casz.caszualmtg.ArchidektImportCheck'
}
tasks.named('check') { dependsOn verifyArchidekt }

tasks.register('verifyStaffColors', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.casz.caszualmtg.StaffColorChecks'
}
tasks.named('check') { dependsOn verifyStaffColors }
