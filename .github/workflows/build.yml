name: Build MTG Companion

on:
  push:
    branches: [ main, fix-hand-card-backs ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build and verify
        run: ./gradlew clean build --stacktrace

      - name: Publish runnable jar to repo
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p release
          JAR="$(find build/libs -maxdepth 1 -type f -name 'mtgcompanion-*.jar' ! -name '*-sources.jar' | sort | head -n 1)"
          test -n "$JAR"
          cp "$JAR" release/mtgcompanion-0.6.0.jar
          sha256sum release/mtgcompanion-0.6.0.jar > release/mtgcompanion-0.6.0.jar.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/mtgcompanion-0.6.0.jar release/mtgcompanion-0.6.0.jar.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Publish MTG Companion 0.6.0 package [skip ci]"
            git push
          fi

      - name: Upload packaged mod
        uses: actions/upload-artifact@v4
        with:
          name: mtgcompanion-${{ github.sha }}
          path: build/libs/mtgcompanion-*.jar
          if-no-files-found: error
          retention-days: 30
