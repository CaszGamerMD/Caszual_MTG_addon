name: Build Caszual MTG

on:
  push:
    branches: [ main, rebrand-caszual-mtg, fix/mtgcard-mousetweaks-earlyload ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build and verify
        run: ./gradlew clean build --stacktrace

      - name: Test MTGCard Mouse Tweaks safety patch
        run: |
          python3 -m unittest discover -s tests -p 'test_patch_mtgcard_mousetweaks.py' -v
          ./gradlew writeRuntimeClasspath --quiet
          python3 tools/verify_mtgcard_patch.py build/runtime-classpath.txt

      - name: Build and verify preserving MTGCard compatibility fixer
        run: |
          mkdir -p build/fixer-classes
          javac --release 25 -d build/fixer-classes tools/MtgCardMouseTweaksFixer.java
          jar --create --file build/mtgcard-mousetweaks-fixer.jar --main-class=MtgCardMouseTweaksFixer -C build/fixer-classes .
          python3 tools/verify_java_fixer.py

      - name: Upload standalone MTGCard fixer
        uses: actions/upload-artifact@v4
        with:
          name: mtgcard-mousetweaks-fixer-${{ github.sha }}
          path: build/mtgcard-mousetweaks-fixer.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish runnable jar to repo
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p release
          JAR="$(find build/libs -maxdepth 1 -type f -name 'caszual-mtg-*.jar' ! -name '*-sources.jar' | sort | head -n 1)"
          test -n "$JAR"
          cp "$JAR" release/caszual-mtg-0.6.0.jar
          sha256sum release/caszual-mtg-0.6.0.jar > release/caszual-mtg-0.6.0.jar.sha256
          cp build/mtgcard-mousetweaks-fixer.jar release/mtgcard-mousetweaks-fixer.jar
          sha256sum release/mtgcard-mousetweaks-fixer.jar > release/mtgcard-mousetweaks-fixer.jar.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/caszual-mtg-0.6.0.jar release/caszual-mtg-0.6.0.jar.sha256 release/mtgcard-mousetweaks-fixer.jar release/mtgcard-mousetweaks-fixer.jar.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Publish Caszual MTG 0.6.0 package [skip ci]"
            git push
          fi

      - name: Upload packaged mod
        uses: actions/upload-artifact@v4
        with:
          name: caszual-mtg-${{ github.sha }}
          path: build/libs/caszual-mtg-*.jar
          if-no-files-found: error
          retention-days: 30
