name: Build Caszual MTG

on:
  push:
    branches: [ main, 'fix/**', 'feat/**', 'chore/**', 'experiment/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build and verify
        run: ./gradlew clean build --stacktrace

      - name: Validate opaque Hand Block texture and model assets
        run: python3 -m unittest discover -s tests -p 'test_hand_assets.py' -v

      - name: Verify Deck Builder / Rack / Card Store integration
        run: python3 -m unittest discover -s tests -p 'test_deck_builder_rack.py' -v

      - name: Verify 70-block Card Hand and Table reciprocal links
        run: python3 -m unittest discover -s tests -p 'test_remote_hand_table_link.py' -v

      - name: Validate Deckbox Rack wall mounting and E/W chair collision
        run: python3 -m unittest discover -s tests -p 'test_wall_mount_chair_bounds.py' -v

      - name: Validate four-staff wall rack and floor-reaching model geometry
        run: python3 -m unittest discover -s tests -p 'test_staff_rack.py' -v

      - name: Validate player-facing utility blockstates
        run: python3 -m unittest discover -s tests -p 'test_utility_box_rotation.py' -v

      - name: Verify placed-only commander artwork and deckbox data safety
        run: python3 -m unittest discover -s tests -p 'test_commander_top.py' -v

      - name: Validate rack rotation, clearances, and non-overlapping surfaces
        run: python3 -m unittest discover -s tests -p 'test_rack_geometry_fixes.py' -v

      - name: Verify Caszual MTG shared item tag coverage
        run: python3 -m unittest discover -s tests -p 'test_caszual_content_tag.py' -v

      - name: Validate fullscreen layouts and Card Store deckbox slot
        run: python3 -m unittest discover -s tests -p 'test_fullscreen_ui.py' -v

      - name: Validate autonomous URL import, persistent stages and deckbox handoff
        run: python3 -m unittest discover -s tests -p 'test_autonomous_url_builder.py' -v

      - name: Validate experimental multiplayer tabletop assets and behavior
        run: python3 -m unittest discover -s tests -p 'test_tabletop.py' -v

      - name: Validate Card Store progress and rack hover tooltips
        run: python3 -m unittest discover -s tests -p 'test_card_store_rack_polish.py' -v

      - name: Validate tabletop chairs, cushion colors and commander reset
        run: python3 -m unittest discover -s tests -p 'test_tabletop_chair_reset.py' -v

      - name: Validate dynamic material-chair crafting and textures
        run: python3 -m unittest discover -s tests -p 'test_chair_material.py' -v

      - name: Validate material-driven tabletop and obsolete chair cleanup
        run: python3 -m unittest discover -s tests -p 'test_tabletop_wood.py' -v

      - name: Validate chair direction hitbox and tapped-card interactions
        run: python3 -m unittest discover -s tests -p 'test_chair_hitbox_and_table_tap.py' -v

      - name: Validate exact 24-bit playmat and paper cushion tinting
        run: python3 -m unittest discover -s tests -p 'test_tabletop_hex_tint.py' -v

      - name: Validate live chair wood and paper cushion refresh
        run: python3 -m unittest discover -s tests -p 'test_chair_refresh.py' -v

      - name: Validate tabletop token tray, counter actions, and P/T previews
        run: python3 -m unittest discover -s tests -p 'test_tabletop_token_counters.py' -v

      - name: Validate Shift-right-click safe battlefield quick-send
        run: python3 -m unittest discover -s tests -p 'test_tabletop_quick_send.py' -v

      - name: Validate ephemeral token copies and reliable token search
        run: python3 -m unittest discover -s tests -p 'test_tabletop_copy_token_search.py' -v

      - name: Validate battlefield counter cleanup and Scry Cancel
        run: python3 -m unittest discover -s tests -p 'test_tabletop_counter_exit.py' -v

      - name: Verify precision dragging, confirm hand moves and reveal-hand privacy
        run: python3 -m unittest discover -s tests -p 'test_tabletop_free_drag_hand_reveal.py' -v

      - name: Validate visible public hands and server-synchronized battlefield zoom
        run: python3 -m unittest discover -s tests -p 'test_tabletop_reveal_zoom.py' -v

      - name: Verify multiplayer deck reveals and native-compatible custom devices
        run: python3 -m unittest discover -s tests -p 'test_tabletop_public_reveal_devices.py' -v

      - name: Validate custom device reskinning and persistent Graveyard lid
        run: python3 -m unittest discover -s tests -p 'test_custom_mtg_device_material_lid.py' -v

      - name: Verify experimental tabletop target and token UI integration
        run: python3 -m unittest discover -s tests -p 'test_ai_tabletop_targets.py' -v

      - name: Verify explicitly linked Card Hand and Brass Squire model
        run: python3 -m unittest discover -s tests -p 'test_hand_setup_squire.py' -v

      - name: Verify MTGCard pod, turn ownership and Golem drawing
        run: python3 -m unittest discover -s tests -p 'test_commander_pod.py' -v

      - name: Verify public tabletop zones, turn notification and life editing
        run: python3 -m unittest discover -s tests -p 'test_tabletop_public_player_status.py' -v

      - name: Publish experimental Commander Golem JAR
        if: github.ref == 'refs/heads/experiment/commander-ai-golem'
        run: |
          mkdir -p release
          JAR="$(find build/libs -maxdepth 1 -type f -name 'caszual-mtg-*.jar' ! -name '*-sources.jar' | sort | head -n 1)"
          test -n "$JAR"
          cp "$JAR" release/caszual-mtg-commander-golem-experimental.jar
          sha256sum release/caszual-mtg-commander-golem-experimental.jar > release/caszual-mtg-commander-golem-experimental.jar.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/caszual-mtg-commander-golem-experimental.jar release/caszual-mtg-commander-golem-experimental.jar.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Publish Commander Golem experiment [skip ci]"
            git push
          fi

      - name: Publish runnable jar to repo
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p release
          JAR="$(find build/libs -maxdepth 1 -type f -name 'caszual-mtg-*.jar' ! -name '*-sources.jar' | sort | head -n 1)"
          test -n "$JAR"
          cp "$JAR" release/caszual-mtg-0.12.0.jar
          sha256sum release/caszual-mtg-0.12.0.jar > release/caszual-mtg-0.12.0.jar.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/caszual-mtg-0.12.0.jar release/caszual-mtg-0.12.0.jar.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Publish Caszual MTG 0.12.0 package [skip ci]"
            git push
          fi

      - name: Upload packaged mod
        uses: actions/upload-artifact@v4
        with:
          name: caszual-mtg-${{ github.sha }}
          path: build/libs/caszual-mtg-*.jar
          if-no-files-found: error
          retention-days: 30
