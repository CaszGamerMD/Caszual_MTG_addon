name: Library-search Oracle composition and seven-deck coverage
on:
  push:
    branches: [experiment/commander-ai-golem]
    paths:
      - training/simulator.py
      - training/library_search_spells.py
      - training/tests/test_library_search_cast.py
      - .github/workflows/commander-library-search.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  library-search-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile training source
        run: python -m compileall -q training
      - name: Check actual search-reveal-shuffle-transfer and seeded random discard
        run: python -m unittest discover -s training/tests -p test_library_search_cast.py -v
      - name: Recheck existing compositional modal targets and loyalty rules
        run: |
          python -m unittest discover -s training/tests -p test_modal_target_cast.py -v
          python -m unittest discover -s training/tests -p test_planeswalker_loyalty.py -v
      - name: Audit all seven saved decks offline
        run: python training/diagnostic_coverage.py
      - name: Retain diagnostic coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-search-deck-coverage
          path: training/reports/diagnostic-coverage.json
          retention-days: 7
