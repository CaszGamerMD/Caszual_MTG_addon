name: Focused Commander card coverage
on:
  push:
    branches: [experiment/commander-ai-golem]
    paths:
      - 'training/**'
      - '.github/workflows/commander-focused-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Count parsed cards and list focused unresolved card names
        run: python training/diagnostic_coverage.py
      - name: Verify newly learned static-language families
        run: python -m unittest discover -s training/tests -p test_static_language_cycles.py -v
      - name: Verify newly implemented Oracle language cycles
        run: |
          python -m unittest discover -s training/tests -p test_chosen_creature_type.py -v
          python -m unittest discover -s training/tests -p test_aura_graveyard_draw.py -v
          python -m unittest discover -s training/tests -p test_attack_target_keywords.py -v
          python -m unittest discover -s training/tests -p test_begin_combat_boost.py -v
          python -m unittest discover -s training/tests -p test_mandatory_tribal_attacks.py -v
          python -m unittest discover -s training/tests -p test_optional_death_damage.py -v
          python -m unittest discover -s training/tests -p test_aura_restrictions.py -v
          python -m unittest discover -s training/tests -p test_aura_entry_tokens.py -v
      - name: Rank unresolved complete Oracle language families
        run: python training/question_batches.py --decks training/decks/*.json --focal-id 5189995 --out training/reports/question-batches-current.json
      - name: Probe seeded diagnostic matches for regression blockers
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'training')
          from simulator import RulesBridge,diagnose
          folder=Path('training/decks')
          patterns=[
              ('14850373-budget-deck.json','5254666-garbo-gobbos.json',42,10),
              ('14850373-budget-deck.json','5254666-garbo-gobbos.json',42,12),
              ('5254666-garbo-gobbos.json','27521806-faeries.json',44,10)]
          with RulesBridge() as rules:
              for a,b,seed,turns in patterns:
                  decks=[json.loads((folder/name).read_text(encoding='utf-8')) for name in (a,b)]
                  result=diagnose(rules,decks,seed,turns)
                  print('FOCUSED_DIAGNOSTIC '+json.dumps({
                      'decks':[a,b],'seed':seed,'turns':turns,
                      'result':result['result'],
                      'runtimeQuestions':result['rulesProgress']['runtimeQuestions'],
                      'lastEvents':[{'kind':e['kind'],'message':e.get('message')} for e in result['events'][-4:]]
                  }))
          PY
      - name: Publish focused coverage report
        uses: actions/upload-artifact@v4
        with:
          name: focused-diagnostic-coverage
          path: |
            training/reports/diagnostic-coverage.json
            training/reports/question-batches-current.json
          retention-days: 14
