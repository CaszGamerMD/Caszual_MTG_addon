name: Focused Commander card coverage
on:
  push:
    branches: [experiment/commander-ai-golem]
    paths:
      - 'training/**'
      - '.github/workflows/commander-focused-coverage.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Count parsed cards and list focused unresolved card names
        run: python training/diagnostic_coverage.py
      - name: Verify newly learned static-language families
        run: python -m unittest discover -s training/tests -p test_static_language_cycles.py -v
      - name: Verify newly implemented Oracle language cycles
        run: |
          python -m unittest discover -s training/tests -p test_artifact_color_mana.py -v
          python -m unittest discover -s training/tests -p test_graveyard_exile_anthem.py -v
          python -m unittest discover -s training/tests -p test_death_exile_cast.py -v
          python -m unittest discover -s training/tests -p test_chosen_creature_type.py -v
          python -m unittest discover -s training/tests -p test_aura_graveyard_draw.py -v
          python -m unittest discover -s training/tests -p test_attack_target_keywords.py -v
          python -m unittest discover -s training/tests -p test_begin_combat_boost.py -v
          python -m unittest discover -s training/tests -p test_mandatory_tribal_attacks.py -v
          python -m unittest discover -s training/tests -p test_optional_death_damage.py -v
          python -m unittest discover -s training/tests -p test_aura_restrictions.py -v
          python -m unittest discover -s training/tests -p test_aura_entry_tokens.py -v
          python -m unittest discover -s training/tests -p test_combat_tribal_tokens.py -v
          python -m unittest discover -s training/tests -p test_land_aura_restrictions.py -v
          python -m unittest discover -s training/tests -p test_land_aura_exile.py -v
          python -m unittest discover -s training/tests -p test_living_weapon.py -v
          python -m unittest discover -s training/tests -p test_linked_exile.py -v
          python -m unittest discover -s training/tests -p test_tribal_tap_tokens.py -v
          python -m unittest discover -s training/tests -p test_scaled_mana.py -v
          python -m unittest discover -s training/tests -p test_sacrifice_mana.py -v
          python -m unittest discover -s training/tests -p test_sacrifice_boost.py -v
          python -m unittest discover -s training/tests -p test_land_team_counters.py -v
          python -m unittest discover -s training/tests -p test_mentor_combat.py -v
          python -m unittest discover -s training/tests -p test_attack_enchantment.py -v
          python -m unittest discover -s training/tests -p test_sacrifice_protection.py -v
          python -m unittest discover -s training/tests -p test_reciprocate_damage.py -v
          python -m unittest discover -s training/tests -p test_recent_color_land_counters.py -v
          python -m unittest discover -s training/tests -p test_regeneration_tribal.py -v
          python -m unittest discover -s training/tests -p test_artifact_chosen_type_cycle.py -v
          python -m unittest discover -s training/tests -p test_attacking_anthem_cycle.py -v
          python -m unittest discover -s training/tests -p test_buffed_endstep_cycle.py -v
          python -m unittest discover -s training/tests -p test_creature_token_characteristics.py -v
          python -m unittest discover -s training/tests -p test_targeted_keyword_choices.py -v
          python -m unittest discover -s training/tests -p test_conditional_target_draw.py -v
      - name: Verify library-language and modal-face integrations
        run: |
          python -m unittest discover -s training/tests -p test_mill_language.py -v
          python -m unittest discover -s training/tests -p test_surveil_language.py -v
          python -m unittest discover -s training/tests -p test_enchantment_abilities.py -v
          python -m unittest discover -s training/tests -p test_modal_faces.py -v
      - name: Rank unresolved complete Oracle language families
        run: python training/question_batches.py --decks training/decks/*.json --focal-id 5189995 --out training/reports/question-batches-current.json
      - name: Probe seeded diagnostic matches for regression blockers
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'training')
          from simulator import RulesBridge,diagnose
          folder=Path('training/decks')
          patterns=[
              ('14850373-budget-deck.json','5254666-garbo-gobbos.json',42,10),
              ('14850373-budget-deck.json','5254666-garbo-gobbos.json',42,12),
              ('5254666-garbo-gobbos.json','27521806-faeries.json',44,10)]
          with RulesBridge() as rules:
              for a,b,seed,turns in patterns:
                  decks=[json.loads((folder/name).read_text(encoding='utf-8')) for name in (a,b)]
                  result=diagnose(rules,decks,seed,turns)
                  print('FOCUSED_DIAGNOSTIC '+json.dumps({
                      'decks':[a,b],'seed':seed,'turns':turns,
                      'result':result['result'],
                      'runtimeQuestions':result['rulesProgress']['runtimeQuestions'],
                      'lastEvents':[{'kind':e['kind'],'message':e.get('message')} for e in result['events'][-4:]]
                  }))
          PY
      - name: Publish focused coverage report
        uses: actions/upload-artifact@v4
        with:
          name: focused-diagnostic-coverage
          path: |
            training/reports/diagnostic-coverage.json
            training/reports/question-batches-current.json
          retention-days: 14
