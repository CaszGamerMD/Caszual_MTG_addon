name: Complete source import

on:
  push:
    paths:
      - '.import/ready'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and import MTG Companion source
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .import/part000
            cat .import/part001
            cat .import/fix002_0
            cat .import/fix002_1
            cat .import/fix002_2
            cat .import/fix002_3
            cat .import/part003
            cat .import/part004
            cat .import/part005
            cat .import/part006
            cat .import/part007
            cat .import/part008
            cat .import/part009
            cat .import/part010
            cat .import/part011
            cat .import/part012
            cat .import/part013
          } | base64 -d > /tmp/mtg.zip
          unzip -t /tmp/mtg.zip
          rm -rf /tmp/mtg-import
          mkdir -p /tmp/mtg-import
          unzip -q /tmp/mtg.zip -d /tmp/mtg-import
          cp -a /tmp/mtg-import/MTGCompanion/. .
          chmod +x gradlew
          rm -rf .import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import MTG Companion 0.4.0 source"
          git push
