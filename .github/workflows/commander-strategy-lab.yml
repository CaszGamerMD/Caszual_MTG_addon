name: Commander strategy A/B diagnostics
on:
  push:
    branches: [experiment/commander-ai-golem]
    paths:
      - training/strategy_plans.py
      - training/strategy_lab.py
      - training/goblin_strategy.py
      - training/tests/test_strategy_lab.py
      - training/tests/test_garbo_strategy.py
      - .github/workflows/commander-strategy-lab.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: strategy-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify strategy tests
        run: |
          python -m unittest discover -s training/tests -p test_strategy_lab.py -v
          python -m unittest discover -s training/tests -p test_garbo_strategy.py -v
      - name: Check both complete decks
        run: |
          python training/diagnostic_coverage.py
          python - <<'PY'
          import json
          data=json.load(open('training/reports/diagnostic-coverage.json'))
          decks={d['deckId']:d for d in data['decks']}
          assert all(decks[i]['unsupported']==0 for i in (5189995,5254666))
          PY
      - name: Generate same-seed unchanged-policy baseline
        run: |
          python training/gauntlet.py --focal training/decks/5189995-enchantments.json --opponents training/decks/5254666-garbo-gobbos.json --games 4 --turns 10 --seed 5189995 --out training/reports/phase-plan-baseline
      - name: Evaluate phase-aware plan for both decks
        run: |
          python training/strategy_lab.py --focal training/decks/5189995-enchantments.json --opponent training/decks/5254666-garbo-gobbos.json --baseline training/reports/phase-plan-baseline/summary.json --games 4 --seed 5189995 --profile phase-plan --out training/reports/phase-plan-baseline/strategy-phase-plan.json
      - name: Evaluate Garbo-only pressure plan against unchanged Wilds AI
        run: |
          python training/strategy_lab.py --focal training/decks/5189995-enchantments.json --opponent training/decks/5254666-garbo-gobbos.json --baseline training/reports/phase-plan-baseline/summary.json --games 4 --seed 5189995 --profile garbo-pressure --out training/reports/phase-plan-baseline/strategy-garbo-pressure.json
      - name: Upload strategy and replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wilds-garbo-strategy-comparison
          path: training/reports/phase-plan-baseline/
          retention-days: 14
  matchup-seven:
    name: Garbo vs original Wilds, 7 games x 15 turns
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate odd game split and policy isolation
        run: python -m unittest discover -s training/tests -p test_seven_game_garbo.py -v
      - name: Play seven games with Garbo pressure and Wilds baseline
        run: python training/seven_game_garbo.py --games 7 --turns 15 --seed 5189995 --out training/reports/garbo-wilds-7x15
      - name: Store score and watchable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garbo-wilds-7x15-results
          path: training/reports/garbo-wilds-7x15/
          retention-days: 14
