name: Planeswalker loyalty foundation - safe offline tests
on:
  push:
    branches: [experiment/commander-ai-golem]
    paths:
      - training/simulator.py
      - training/planeswalker_loyalty.py
      - training/planeswalker_runtime.py
      - training/planeswalker_strategy.py
      - training/planeswalker_strategy_skirmishes.py
      - training/tests/test_planeswalker_strategy.py
      - training/planeswalker_conditional.py
      - training/advanced_simulator.py
      - training/tests/test_planeswalker_conditional.py
      - training/planeswalker_duration.py
      - training/planeswalker_emblems.py
      - training/planeswalker_phasing.py
      - training/tests/test_planeswalker_phasing.py
      - training/tests/test_planeswalker_combat_emblem.py
      - training/tests/test_planeswalker_emblems.py
      - training/tests/test_planeswalker_composed.py
      - training/planeswalker_inventory.py
      - training/decks/**
      - training/tests/test_planeswalker_inventory.py
      - training/tests/test_planeswalker_loyalty.py
      - .github/workflows/commander-planeswalker-foundation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loyalty-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile training source
        run: python -m compileall -q training
      - name: Test generic loyalty activation, costs, resolution and safety
        run: python -m unittest discover -s training/tests -p test_planeswalker_loyalty.py -v
      - name: Test composed targeted and graveyard loyalty blocks
        run: python -m unittest discover -s training/tests -p test_planeswalker_composed.py -v
      - name: Verify persistent loyalty emblems and delayed stack triggers
        run: python -m unittest discover -s training/tests -p test_planeswalker_emblems.py -v
      - name: Verify full Kaito Oracle, phasing and untap timing
        run: python -m unittest discover -s training/tests -p test_planeswalker_phasing.py -v
      - name: Test combat-damage emblems and library tutor
        run: python -m unittest discover -s training/tests -p test_planeswalker_combat_emblem.py -v
      - name: Test conditional card draw and unblocked Ninja rules
        run: python -m unittest discover -s training/tests -p test_planeswalker_conditional.py -v
      - name: Validate situational loyalty AI decision quality
        run: python -m unittest discover -s training/tests -p test_planeswalker_strategy.py -v
      - name: Simulate seeded AI against AI planeswalker skirmishes
        run: python training/planeswalker_strategy_skirmishes.py
      - name: Verify real saved-deck planeswalker evidence
        run: |
          python -m unittest discover -s training/tests -p test_planeswalker_inventory.py -v
          python training/planeswalker_inventory.py
      - name: Keep existing multi-mode loyalty-counter interaction working
        run: |
          python -m unittest discover -s training/tests -p test_modal_multi_target.py -v
          python -m unittest discover -s training/tests -p test_modal_target_cast.py -v
      - name: Rerun all seven saved deck diagnostics offline
        run: python training/diagnostic_coverage.py
      - name: Retain audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planeswalker-deck-diagnostic
          path: |
            training/reports/diagnostic-coverage.json
            training/reports/planeswalker-capabilities.json
            training/reports/planeswalker-strategy-skirmishes.json
          retention-days: 7
